[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "data",
    "dataset",
    "results",
]

[tool.ruff.lint]
# Start with rules that catch syntax and runtime-critical mistakes. The legacy
# modules can adopt the broader Ruff rule set incrementally.
select = ["E9", "F63", "F7", "F821", "F822", "F823"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
