name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source without model weights
        uses: actions/checkout@v4
        with:
          lfs: false
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install static checker
        run: python -m pip install "ruff>=0.12,<1"

      - name: Run Ruff
        run: ruff check .

      - name: Check Python formatting
        run: ruff format --check .

      - name: Check English comments
        run: python scripts/check_english_comments.py

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Validate shell syntax
        run: bash -n train_accelerate.sh infer_with_spk.sh

  regression-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install CPU runtime and test dependencies
        run: |
          python -m pip install torch==2.11.0 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt -r requirements-dev.txt "accelerate>=1.0,<2"
      - name: Run regression tests without downloading checkpoints
        run: python -m pytest -q
