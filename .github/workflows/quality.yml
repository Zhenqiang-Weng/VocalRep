name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source without model weights
        uses: actions/checkout@v4
        with:
          lfs: false
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install static checker
        run: python -m pip install "ruff>=0.12,<1"

      - name: Run Ruff
        run: ruff check .

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Validate shell syntax
        run: bash -n train_accelerate.sh infer_with_spk.sh
